<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Bubble — Find Your Creative Space</title>
    <!-- IBM Plex Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main scroll container -->
    <div id="scroll-container">

        <!-- Scene 1: The Blank Canvas (Friction) -->
        <section id="scene-1" class="scene active">
            <div class="scene-content">
                <!-- Title -->
                <div id="intro-title">
                    <h1>
                        <span class="title-concept">CONCEPT</span>
                        <span class="title-bubble">BUBBLE</span>
                    </h1>
                    <p class="tagline">AI removes friction. Human taste makes the call.</p>
                </div>

                <!-- The Easel and Canvas -->
                <div id="easel-container">
                    <div id="easel">
                        <div id="easel-post"></div>
                        <div id="easel-base"></div>
                    </div>
                    <div id="canvas-frame">
                        <canvas id="preview-canvas" width="250" height="290"></canvas>
                    </div>
                </div>
                
                    <!-- The Girl Character (PNG from Figma) -->
                <div id="girl-container">
                    <img src="assets/girl-scene1.png" alt="Girl painting at easel" id="girl-image">
                </div>

                <!-- Floating Tasks (distractions) -->
                <div id="floating-tasks">
                    <!-- Tasks will be generated by JS -->
                </div>

                <!-- Interference overlay for Scene 1 -->
                <div id="interference-layer"></div>

                <!-- Paint prompt -->
                <div id="paint-prompt">
                    <span>Try to paint with friction.</span>
                </div>
            </div>

            <div class="scroll-hint">
                <svg class="scroll-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4L12 20M12 20L6 14M12 20L18 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </section>

        <!-- Scene 2: Emergence of Bubbles -->
        <section id="scene-2" class="scene">
            <div class="scene-content">
                <!-- Instruction -->
                <div id="bubble-instruction">
                    <p>Drag bubbles onto tasks to capture them.</p>
                </div>

                <!-- Bubbles container -->
                <div id="bubbles-container">
                    <!-- Bubbles generated by JS -->
                </div>

                <!-- Detached tasks float here -->
                <div id="detached-tasks">
                    <!-- Moved from scene 1 -->
                </div>

                <!-- Neurons background -->
                <div id="neurons-scene2"></div>
            </div>

            <div class="scroll-hint">
                <svg class="scroll-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4L12 20M12 20L6 14M12 20L18 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </section>

        <!-- Scene 3: Calm Field -->
        <section id="scene-3" class="scene">
            <div class="scene-content">
                <!-- Neuron background -->
                <canvas id="neuron-canvas"></canvas>

                <!-- Top text -->
                <p class="scene3-intro">Now that friction is removed...</p>

                <!-- Girl with clear space -->
                <div id="girl-clear">
                    <img src="assets/girl-scene3.png" alt="Girl at peace" id="girl-calm-image">
                </div>

                <!-- Main message -->
                <div class="calm-message">
                    <p>You have space to <span class="highlight">THINK</span>.</p>
                    <p>Room to <span class="highlight">BREATHE</span>.</p>
                </div>

                <!-- Captured bubbles float peacefully -->
                <div id="peaceful-bubbles">
                    <!-- Captured bubbles move here -->
                </div>
            </div>

            <div class="scroll-hint">
                <svg class="scroll-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4L12 20M12 20L6 14M12 20L18 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </section>

        <!-- Scene 4: The Moment to Create -->
        <section id="scene-4" class="scene">
            <div class="scene-content">
                <div id="create-prompt">
                    <h2>Now <span class="gradient-text">Create</span>.</h2>
                    <p>Click the canvas to paint.</p>
                </div>

                <!-- Floating canvas for click-to-start -->
                <div id="floating-canvas-trigger">
                    <div id="easel-post-trigger"></div>
                    <div class="canvas-frame-trigger">
                        <div class="canvas-surface"></div>
                    </div>
                    <div id="easel-base-trigger"></div>
                </div>
            </div>

            <div class="scroll-hint">
                <svg class="scroll-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4L12 20M12 20L6 14M12 20L18 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </section>

        <!-- Scene 5: Download & Signature -->
        <section id="scene-5" class="scene">
            <div class="scene-content">
                <div id="final-area">
                    <p class="final-text">your creation is ready</p>
                    <div id="final-preview"></div>
                    <button id="download-btn">Download Painting</button>
                    <p class="signature">Concept Bubble</p>
                </div>
            </div>
        </section>

    </div>

    <!-- Full painting canvas (overlay) -->
    <div id="painting-area" class="hidden">
        <!-- Close button -->
        <button id="close-painting" title="Close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <div id="painting-container">
            <div id="painting-easel-post"></div>
            <canvas id="painting-canvas" width="700" height="500"></canvas>
        </div>

        <!-- Color palette -->
        <div id="color-palette">
            <button class="color-btn" data-color="#0D0D0D" style="background: #0D0D0D;" title="Black"></button>
            <button class="color-btn" data-color="#A855F7" style="background: #A855F7;" title="Purple"></button>
            <button class="color-btn active" data-color="#FFA500" style="background: #FFA500;" title="Amber"></button>
            <button class="color-btn" data-color="#FFFFFF" style="background: #FFFFFF;" title="White"></button>
        </div>

        <!-- Download button in paint mode -->
        <button id="download-btn-paint">Download Painting</button>

        <!-- Brush cursor indicator -->
        <div id="brush-cursor"></div>
    </div>

    <!-- Global cursor effect -->
    <div id="cursor-glow"></div>

    <!-- Progress indicator -->
    <div id="progress-bar"></div>

    <script src="script.js"></script>
</body>
</html>
