<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Bubble — Find Your Creative Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main scroll container -->
    <div id="scroll-container">

        <!-- Scene 1: The Blank Canvas (Friction) -->
        <section id="scene-1" class="scene active">
            <div class="scene-content">
                <!-- The Girl Character (SVG) -->
                <div id="girl-container">
                    <svg id="girl" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
                        <!-- Hair (back layer) -->
                        <path class="hair hair-back" d="M60 80 Q40 120 45 180 Q50 220 60 260 Q30 200 35 140 Q40 90 70 60 Z" fill="#FFA500"/>
                        <path class="hair hair-back" d="M140 80 Q160 120 155 180 Q150 220 140 260 Q170 200 165 140 Q160 90 130 60 Z" fill="#FFA500"/>

                        <!-- Body -->
                        <ellipse cx="100" cy="280" rx="35" ry="50" fill="#2a2a2a"/>

                        <!-- Neck -->
                        <rect x="90" y="200" width="20" height="30" fill="#f5d0c5" rx="5"/>

                        <!-- Head -->
                        <ellipse cx="100" cy="150" rx="50" ry="60" fill="#f5d0c5"/>

                        <!-- Hair (front layer) -->
                        <path class="hair hair-front" d="M50 130 Q55 80 100 70 Q145 80 150 130 Q145 100 100 95 Q55 100 50 130 Z" fill="#FFA500"/>
                        <path class="hair hair-side-left" d="M50 130 Q45 150 50 180 Q48 160 55 140 Z" fill="#E89500"/>
                        <path class="hair hair-side-right" d="M150 130 Q155 150 150 180 Q152 160 145 140 Z" fill="#E89500"/>

                        <!-- Face -->
                        <ellipse cx="80" cy="145" rx="8" ry="5" fill="#0D0D0D"/> <!-- Left eye -->
                        <ellipse cx="120" cy="145" rx="8" ry="5" fill="#0D0D0D"/> <!-- Right eye -->
                        <ellipse cx="82" cy="144" rx="2" ry="2" fill="#FFFFFF"/> <!-- Eye shine -->
                        <ellipse cx="122" cy="144" rx="2" ry="2" fill="#FFFFFF"/> <!-- Eye shine -->
                        <path d="M90 175 Q100 182 110 175" stroke="#c9918a" stroke-width="3" fill="none" stroke-linecap="round"/> <!-- Mouth -->
                        <ellipse cx="65" cy="165" rx="10" ry="6" fill="#ffb7a3" opacity="0.5"/> <!-- Blush left -->
                        <ellipse cx="135" cy="165" rx="10" ry="6" fill="#ffb7a3" opacity="0.5"/> <!-- Blush right -->

                        <!-- Arms -->
                        <path class="arm arm-left" d="M65 250 Q40 270 35 300" stroke="#f5d0c5" stroke-width="12" fill="none" stroke-linecap="round"/>
                        <path class="arm arm-right" d="M135 250 Q160 260 175 240" stroke="#f5d0c5" stroke-width="12" fill="none" stroke-linecap="round"/>

                        <!-- Hand holding brush -->
                        <circle cx="175" cy="235" r="8" fill="#f5d0c5"/>
                    </svg>
                </div>

                <!-- The Easel and Canvas -->
                <div id="easel-container">
                    <div id="easel">
                        <div id="easel-leg-left"></div>
                        <div id="easel-leg-right"></div>
                        <div id="easel-shelf"></div>
                    </div>
                    <canvas id="preview-canvas" width="300" height="220"></canvas>
                    <div id="canvas-hint">try to paint...</div>
                </div>

                <!-- Floating Tasks (distractions) -->
                <div id="floating-tasks">
                    <!-- Tasks will be generated by JS -->
                </div>

                <!-- Interference overlay for Scene 1 -->
                <div id="interference-layer"></div>
            </div>

            <div class="scroll-hint">
                <span>scroll to continue</span>
                <div class="scroll-arrow"></div>
            </div>
        </section>

        <!-- Scene 2: Emergence of Bubbles -->
        <section id="scene-2" class="scene">
            <div class="scene-content">
                <!-- Bubbles container -->
                <div id="bubbles-container">
                    <!-- Bubbles generated by JS -->
                </div>

                <!-- Detached tasks float here -->
                <div id="detached-tasks">
                    <!-- Moved from scene 1 -->
                </div>

                <!-- Girl stays visible but smaller -->
                <div id="girl-small"></div>

                <div id="capture-hint">drag bubbles onto tasks to capture them</div>
            </div>
        </section>

        <!-- Scene 3: Calm Field -->
        <section id="scene-3" class="scene">
            <div class="scene-content">
                <!-- Neuron background -->
                <canvas id="neuron-canvas"></canvas>

                <!-- Captured bubbles float peacefully -->
                <div id="peaceful-bubbles">
                    <!-- Captured bubbles move here -->
                </div>

                <!-- Girl with clear space -->
                <div id="girl-clear">
                    <div id="girl-calm"></div>
                    <div id="canvas-preview-calm"></div>
                </div>

                <p class="calm-text">space to think. room to breathe.</p>
            </div>
        </section>

        <!-- Scene 4: The Moment to Create -->
        <section id="scene-4" class="scene">
            <div class="scene-content">
                <div id="create-prompt">
                    <p>click the canvas to begin creating</p>
                </div>

                <!-- Full painting canvas -->
                <div id="painting-area" class="hidden">
                    <canvas id="painting-canvas" width="800" height="600"></canvas>

                    <!-- Color palette -->
                    <div id="color-palette">
                        <button class="color-btn active" data-color="#FFA500" style="background: #FFA500;" title="Amber - Human"></button>
                        <button class="color-btn" data-color="#8F24F5" style="background: #8F24F5;" title="Purple - Tech"></button>
                        <button class="color-btn" data-color="#0D0D0D" style="background: #0D0D0D;" title="Black"></button>
                        <button class="color-btn" data-color="#FFFFFF" style="background: #FFFFFF; border: 1px solid #ccc;" title="White"></button>
                    </div>

                    <!-- Brush size -->
                    <div id="brush-controls">
                        <label for="brush-size">brush</label>
                        <input type="range" id="brush-size" min="2" max="50" value="12">
                    </div>

                    <!-- Clear button -->
                    <button id="clear-canvas">clear</button>
                </div>

                <!-- Floating canvas for click-to-start -->
                <div id="floating-canvas-trigger">
                    <div class="canvas-frame">
                        <div class="canvas-surface"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Scene 5: Download & Signature -->
        <section id="scene-5" class="scene">
            <div class="scene-content">
                <div id="final-area">
                    <p class="final-text">your creation is ready</p>
                    <div id="final-preview"></div>
                    <button id="download-btn">download your artwork</button>
                    <p class="signature">Concept Bubble</p>
                </div>
            </div>
        </section>

    </div>

    <!-- Global cursor effect -->
    <div id="cursor-glow"></div>

    <!-- Progress indicator -->
    <div id="progress-bar"></div>

    <script src="script.js"></script>
</body>
</html>
